/* GCash Health Access — design tokens and base components.
   Sampled from the real GCash app (app-screens/reference/IMG_1300–1304, iOS, Oct 2026).
   See BRAND_GUIDE.md for usage rules. */


:root {
  /* Brand */
  --gc-logo-navy: #002EC7;      /* GCash wordmark */
  --gc-logo-blue: #0080FF;      /* outer ring of the G mark */
  --gc-logo-sky: #52BCFD;       /* signal arcs */

  /* Surfaces */
  --gc-header: #3670F0;         /* app bar on GInsure list pages */
  --gc-header-deep: #0138B3;    /* app bar on product detail pages */
  --gc-home-top: #488CF4;       /* home header gradient, top */
  --gc-home-bottom: #2450CC;    /* home header gradient, bottom */
  --gc-wallet: #1D48C4;         /* active segment on the home tab bar */
  --gc-page: #ECF1FA;           /* grey-blue page background */
  --gc-page-alt: #F1F7FE;       /* lighter section background */
  --gc-band: #DEE9F3;           /* banner carousel band */
  --gc-card: #FFFFFF;
  --gc-divider: #E3E9F2;

  /* Action */
  --gc-cta: #0057E4;            /* primary pill button */
  --gc-cta-pressed: #0047BD;
  --gc-link: #2458E0;           /* "View All", chevrons, active nav, provider name */
  --gc-tab-active: #1030B0;     /* tab label and underline */
  --gc-chip: #EAF1FF;           /* selected state fill */

  /* Text */
  --gc-heading: #0C248C;        /* section headings ("Categories") */
  --gc-text: #102454;           /* product titles, strong body */
  --gc-text-2: #485880;         /* icon labels, values */
  --gc-text-3: #6C7CA4;         /* meta, secondary body */
  --gc-text-4: #8593AB;         /* inactive tabs */
  --gc-placeholder: #ACACB0;
  --gc-nav-off: #989898;

  /* Accents */
  --gc-promo: #FBC608;          /* "Best Value" ribbon */
  --gc-badge-red: #E5322D;      /* "Global" / "Travel" tag (approximate) */
  --gc-success: #12A150;        /* not seen in the references; use sparingly */
  --gc-success-soft: #E5F6EC;
  --gc-warn-soft: #FFF6DA;

  /* Partners */
  --fuse-orange: #FFAA19;
  --pioneer-navy: #002F81;
  --pioneer-grey: #A7A9AD;

  /* Shape */
  --r-card: 14px;
  --r-tile: 12px;
  --r-pill: 999px;
  --shadow-card: 0 2px 8px rgba(16, 36, 84, 0.06);
  --shadow-cta: 0 6px 16px rgba(0, 87, 228, 0.28);

  --font: 'Plus Jakarta Sans', -apple-system, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif;
}

/* ---------- Base ---------- */
.gc { font-family: var(--font); color: var(--gc-text); -webkit-font-smoothing: antialiased; }

/* App bar: blue, centered white title, back arrow left, info right */
.gc-appbar { display: flex; align-items: center; height: 56px; padding: 0 16px; background: var(--gc-header); color: #fff; }
.gc-appbar.deep { background: var(--gc-header-deep); }
.gc-appbar .title { flex: 1; text-align: center; font-size: 18px; font-weight: 600; letter-spacing: -0.1px; }
.gc-appbar.left .title { text-align: left; margin-left: 16px; }
.gc-appbar svg { width: 24px; height: 24px; flex: none; }

/* Type scale (pt at 1x) */
.gc-h1 { font-size: 24px; font-weight: 800; letter-spacing: -0.4px; color: var(--gc-text); }
.gc-h2 { font-size: 20px; font-weight: 700; color: var(--gc-heading); }
.gc-h3 { font-size: 17px; font-weight: 600; color: var(--gc-text); }
.gc-body { font-size: 14px; font-weight: 400; color: var(--gc-text-2); line-height: 1.45; }
.gc-meta { font-size: 13px; color: var(--gc-text-3); }
.gc-label { font-size: 11px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: var(--gc-text-3); }
.gc-amount { font-size: 34px; font-weight: 800; letter-spacing: -0.8px; color: var(--gc-text); }
.gc-link { color: var(--gc-link); font-weight: 600; }

/* Buttons */
.gc-btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; height: 50px;
          border: 0; border-radius: var(--r-pill); background: var(--gc-cta); color: #fff;
          font: 700 17px var(--font); box-shadow: var(--shadow-cta); }
.gc-btn:active { background: var(--gc-cta-pressed); }
.gc-btn.secondary { background: #fff; color: var(--gc-cta); border: 1.5px solid var(--gc-cta); box-shadow: none; }
.gc-btn.ghost { background: transparent; color: var(--gc-link); box-shadow: none; }
.gc-btn:disabled { background: #C9D3E6; box-shadow: none; }

/* Cards and rows */
.gc-card { background: var(--gc-card); border-radius: var(--r-card); box-shadow: var(--shadow-card); }
.gc-row { display: flex; align-items: center; gap: 14px; padding: 16px; }
.gc-row + .gc-row { border-top: 1px solid var(--gc-divider); }

/* Tabs: active label + 3px underline */
.gc-tabs { display: flex; background: #fff; border-bottom: 1px solid var(--gc-divider); }
.gc-tabs > div { flex: 1; text-align: center; padding: 14px 0 11px; font-size: 16px; font-weight: 600; color: var(--gc-text-4); border-bottom: 3px solid transparent; }
.gc-tabs > .on { color: var(--gc-tab-active); border-color: var(--gc-tab-active); }

/* Chips and badges */
.gc-badge { display: inline-flex; align-items: center; gap: 4px; padding: 3px 8px; border-radius: 6px; font-size: 11px; font-weight: 700; }
.gc-badge.red { background: var(--gc-badge-red); color: #fff; }
.gc-badge.green { background: var(--gc-success-soft); color: var(--gc-success); }
.gc-badge.blue { background: var(--gc-chip); color: var(--gc-link); }
.gc-ribbon { background: var(--gc-promo); color: var(--gc-text); text-align: center; padding: 8px 12px; font-size: 13px; }
.gc-ribbon b { font-weight: 800; }

/* Product list row (GInsure > Health) */
.gc-product { display: flex; gap: 16px; align-items: center; padding: 20px 16px; background: #fff; }
.gc-product + .gc-product { border-top: 1px solid var(--gc-divider); }
.gc-product .logo { width: 50px; height: 50px; border-radius: 4px; flex: none; }
.gc-product .provider { font-size: 14px; color: var(--gc-link); font-weight: 500; }
.gc-product .name { font-size: 17px; font-weight: 600; color: var(--gc-text); margin: 4px 0 6px; }
.gc-product .meta { font-size: 13px; color: var(--gc-text-3); line-height: 1.6; }
.gc-product .meta b { color: var(--gc-text-2); font-weight: 500; }

/* Icon grid tile (Categories / home shortcuts) */
.gc-tile { display: flex; flex-direction: column; align-items: center; gap: 8px; font-size: 14px; font-weight: 500; color: #2040A8; }
.gc-tile img { width: 44px; height: 44px; }

/* Bottom nav */
.gc-nav { display: flex; justify-content: space-around; align-items: flex-end; height: 84px; padding-bottom: 26px; background: #fff; border-top: 1px solid var(--gc-divider); }
.gc-nav > div { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; color: var(--gc-nav-off); }
.gc-nav > .on { color: var(--gc-link); }
.gc-nav svg { width: 24px; height: 24px; }
.gc-nav .qr { width: 58px; height: 58px; margin-bottom: 2px; border-radius: 50%; border: 3px solid var(--gc-link); background: #fff; display: grid; place-items: center; color: var(--gc-link); }

/* GCash Health Access — live demo styles. Brand tokens come from ../../brand/tokens.css. */

html, body { margin: 0; height: 100%; background: var(--gc-page); overscroll-behavior: none; }
body.framed { background: #0B1A3F; }
body { font-family: var(--font); color: var(--gc-text); -webkit-font-smoothing: antialiased;
       -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; touch-action: manipulation; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
* { box-sizing: border-box; }

/* Phone: full screen. Desktop: an iPhone 17-sized frame (402 x 874 pt). */
:root { --sat: env(safe-area-inset-top, 0px); --sab: env(safe-area-inset-bottom, 0px); }
/* Explicit height: in iOS home-screen mode with a translucent status bar, inset:0 / 100vh stop
   short of the bottom by the top safe area (62pt on iPhone 17). app.js sets --app-h. */
html, body { min-height: var(--app-h, 100dvh); }
html.fullh, html.fullh body { height: var(--app-h); overflow: hidden; }
.device { position: absolute; top: 0; left: 0; right: 0; height: var(--app-h, 100dvh); overflow: hidden; background: var(--gc-page); }
.framed { display: grid; place-items: center; min-height: 100%; background: radial-gradient(circle at 50% 30%, #1B3C8C, #0B1A3F 70%); }
.framed .device { position: relative; inset: auto; top: auto; left: auto; right: auto; width: 402px; height: 874px; border-radius: 56px;
                  box-shadow: 0 0 0 11px #1A1C22, 0 0 0 13px #3A3D46, 0 30px 80px rgba(0,0,0,.5); }
.framed { --sat: 54px; --sab: 26px; }
.fake-status { display: none; }
.framed .fake-status { display: block; position: absolute; top: 0; left: 0; right: 0; height: 54px; z-index: 50; pointer-events: none; }
.fake-status img { position: absolute; top: 7px; left: 6px; width: 390px; }
.fake-status i { position: absolute; top: 11px; left: 50%; width: 124px; height: 36px; margin-left: -62px; border-radius: 20px; background: #000; }
.framed .home-ind { position: absolute; bottom: 8px; left: 50%; width: 140px; height: 5px; margin-left: -70px; border-radius: 3px; background: rgba(0,0,0,.85); z-index: 50; pointer-events: none; }

/* Screens and transitions */
.scr { position: absolute; inset: 0; display: flex; flex-direction: column; background: var(--gc-page); will-change: transform; }
.scr.enter-fwd { animation: inR .32s cubic-bezier(.2,.8,.2,1) both; }
.scr.leave-fwd { animation: outL .32s cubic-bezier(.2,.8,.2,1) both; }
.scr.enter-back { animation: inL .32s cubic-bezier(.2,.8,.2,1) both; }
.scr.leave-back { animation: outR .32s cubic-bezier(.2,.8,.2,1) both; z-index: 2; }
.scr.fade { animation: fadeIn .45s ease both; }
@keyframes inR { from { transform: translateX(100%); } }
@keyframes outL { to { transform: translateX(-28%); filter: brightness(.92); } }
@keyframes inL { from { transform: translateX(-28%); } }
@keyframes outR { to { transform: translateX(100%); } }
@keyframes fadeIn { from { opacity: 0; } }

.body { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }
.body::-webkit-scrollbar { display: none; }
.pad { padding: 16px; }
.foot { flex: none; position: relative; z-index: 3; padding: 12px 16px calc(12px + var(--sab)); background: #fff; box-shadow: 0 -4px 16px rgba(16,36,84,.06); }
.foot.clear { background: transparent; box-shadow: none; }

/* App bar */
.bar { flex: none; padding-top: var(--sat); background: var(--gc-header); color: #fff; }
.bar.deep { background: var(--gc-header-deep); }
.bar .in { height: 52px; display: flex; align-items: center; padding: 0 14px; gap: 10px; }
.bar .t { flex: 1; text-align: center; font-size: 18px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bar.left .t { text-align: left; }
.bar .ib { width: 32px; height: 32px; display: grid; place-items: center; flex: none; }
.bar .ib svg { width: 24px; height: 24px; }

/* Shared bits */
.ic svg { width: 100%; height: 100%; display: block; }
.card { background: #fff; border-radius: var(--r-card); box-shadow: var(--shadow-card); }
.sec-h { font-size: 20px; font-weight: 700; color: var(--gc-heading); margin: 22px 0 12px; display: flex; justify-content: space-between; align-items: baseline; }
.sec-h a { font-size: 15px; font-weight: 600; color: var(--gc-link); }
.meta { font-size: 13px; color: var(--gc-text-3); }
.k { color: var(--gc-text-2); }
.v { font-weight: 700; color: var(--gc-text); }
.row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.rows .row { padding: 11px 0; font-size: 14px; }
.rows .row + .row { border-top: 1px solid var(--gc-divider); }
.neg { color: var(--gc-success); font-weight: 700; }
.btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; height: 52px; border-radius: 999px;
       background: var(--gc-cta); color: #fff; font-size: 17px; font-weight: 700; box-shadow: var(--shadow-cta); transition: transform .1s, opacity .2s; }
.btn:active { transform: scale(.98); background: var(--gc-cta-pressed); }
.btn[disabled] { background: #C3CEE3; box-shadow: none; pointer-events: none; }
.btn.sec { background: #fff; color: var(--gc-cta); border: 1.5px solid var(--gc-cta); box-shadow: none; }
.btn svg { width: 20px; height: 20px; }
.badge { display: inline-flex; align-items: center; padding: 3px 8px; border-radius: 6px; font-size: 11px; font-weight: 800; letter-spacing: .3px; }
.badge.red { background: var(--gc-badge-red); color: #fff; }
.badge.green { background: var(--gc-success-soft); color: var(--gc-success); }
.badge.blue { background: var(--gc-chip); color: var(--gc-link); }
.badge.yellow { background: var(--gc-promo); color: var(--gc-text); }
.check { width: 24px; height: 24px; border-radius: 7px; border: 2px solid #B8C3D9; display: grid; place-items: center; flex: none; transition: .15s; background: #fff; }
.check svg { width: 15px; height: 15px; opacity: 0; color: #fff; }
.on > .check, .check.on { background: var(--gc-cta); border-color: var(--gc-cta); }
.on > .check svg, .check.on svg { opacity: 1; }
.radio { width: 22px; height: 22px; border-radius: 50%; border: 2px solid #B8C3D9; flex: none; display: grid; place-items: center; }
.on .radio { border-color: var(--gc-cta); }
.on .radio::after { content: ''; width: 11px; height: 11px; border-radius: 50%; background: var(--gc-cta); }
.partner { display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 12px; color: var(--gc-text-3); }
.partner img { height: 16px; }

/* Login */
.login { background: linear-gradient(180deg, #4E93F7 0%, #2F6CEB 55%, #1D48C4 100%); color: #fff; align-items: center; }
.login .logo { margin-top: calc(var(--sat) + 90px); width: 210px; }
.login .hello { margin-top: 56px; font-size: 26px; font-weight: 800; }
.login .num { margin-top: 18px; padding: 14px 26px; border-radius: 999px; background: rgba(255,255,255,.16); font-size: 22px; font-weight: 600; letter-spacing: 1px; }
.login .opts { margin-top: auto; width: calc(100% - 64px); display: grid; grid-template-columns: 1fr 1fr; background: #fff; border-radius: 18px; overflow: hidden; color: var(--gc-link); }
.login .opts button { padding: 22px 0 18px; display: flex; flex-direction: column; align-items: center; gap: 10px; font-size: 14px; font-weight: 600; }
.login .opts button + button { border-left: 1px solid var(--gc-divider); }
.login .opts svg { width: 40px; height: 40px; }
.login .links { display: flex; justify-content: space-around; width: 100%; margin: 26px 0 calc(28px + var(--sab)); font-size: 14px; opacity: .9; }
.faceid { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(10,20,50,.35); z-index: 40; animation: fadeIn .2s; }
.faceid div { width: 150px; height: 150px; border-radius: 34px; background: rgba(30,30,35,.92); display: grid; place-items: center; }
.faceid svg { width: 76px; height: 76px; color: #fff; }
.faceid .ok { color: #34C759; }

/* Home */
.home-top { background: linear-gradient(180deg, var(--gc-home-top), var(--gc-home-bottom)); padding: var(--sat) 16px 0; color: #fff; }
.home-top .hi { display: flex; align-items: center; gap: 10px; height: 60px; }
.home-top .hi img { height: 30px; }
.home-top .hi b { font-size: 24px; font-weight: 700; flex: 1; }
.home-top .help { padding: 6px 14px; border-radius: 999px; background: rgba(15,40,150,.55); font-size: 13px; font-weight: 800; letter-spacing: .5px; }
.segs { display: grid; grid-template-columns: repeat(4, 1fr); background: #fff; border-radius: 12px 12px 0 0; overflow: hidden; margin-top: 6px; }
.segs div { text-align: center; padding: 11px 0; font-size: 16px; font-weight: 600; color: var(--gc-link); }
.segs .on { background: var(--gc-wallet); color: #fff; }
.bal { background: linear-gradient(110deg, #2756D1, #3B7BEF 70%, #5A97F6); padding: 18px 16px 20px; display: flex; align-items: flex-end; justify-content: space-between; }
.bal .l { font-size: 11px; font-weight: 600; letter-spacing: 1px; opacity: .8; display: flex; gap: 8px; align-items: center; }
.bal .l svg { width: 18px; height: 18px; }
.bal .amt { font-size: 28px; font-weight: 800; margin-top: 8px; letter-spacing: -.5px; min-height: 36px; }
.bal .ci { padding: 10px 16px; border-radius: 999px; background: rgba(255,255,255,.85); color: var(--gc-link); font-size: 15px; font-weight: 700; }
.svc { display: grid; grid-template-columns: repeat(4, 1fr); row-gap: 18px; padding: 20px 6px 18px; background: #fff; margin: 0 16px; border-radius: 0 0 12px 12px; box-shadow: var(--shadow-card); }
.tile { display: flex; flex-direction: column; align-items: center; gap: 7px; font-size: 13.5px; font-weight: 500; color: var(--gc-text-2); position: relative; }
.tile img { width: 46px; height: 46px; }
.tile .badge { position: absolute; top: -8px; right: 6px; font-size: 10px; padding: 2px 6px; }
.tile.hl img { filter: drop-shadow(0 4px 10px rgba(36,88,224,.35)); }
.promo { margin: 16px 16px 0; border-radius: 16px; overflow: hidden; position: relative; padding: 18px 18px 16px;
         background: linear-gradient(115deg, #0138B3 0%, #2458E0 60%, #4E93F7 100%); color: #fff; box-shadow: var(--shadow-card); }
.promo .tag { display: inline-block; padding: 3px 8px; border-radius: 6px; background: var(--gc-promo); color: var(--gc-text); font-size: 11px; font-weight: 800; }
.promo h3 { margin: 10px 0 4px; font-size: 21px; font-weight: 800; line-height: 1.2; max-width: 230px; }
.promo p { margin: 0; font-size: 13.5px; opacity: .9; max-width: 220px; }
.promo .go { margin-top: 12px; display: inline-flex; padding: 8px 14px; border-radius: 999px; background: #fff; color: var(--gc-cta); font-size: 14px; font-weight: 700; }
.promo .art { position: absolute; right: -6px; bottom: -6px; width: 128px; opacity: .95; }
.promo .by { position: absolute; top: 16px; right: 16px; height: 18px; opacity: .95; }
.nav { flex: none; position: relative; z-index: 3; display: flex; justify-content: space-around; align-items: flex-end; padding: 8px 0 calc(6px + var(--sab)); background: #fff; border-top: 1px solid var(--gc-divider); }
.nav > div { width: 64px; display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 11px; color: var(--gc-nav-off); }
.nav > .on { color: var(--gc-link); font-weight: 600; }
.nav svg { width: 25px; height: 25px; }
.nav .qr { width: 58px; height: 58px; margin-top: -26px; border-radius: 50%; border: 3px solid var(--gc-link); background: #fff; display: grid; place-items: center; color: var(--gc-link); }

/* GInsure */
.search { display: flex; align-items: center; gap: 12px; padding: 14px 18px; background: #fff; color: var(--gc-placeholder); font-size: 15px; }
.search svg { width: 22px; height: 22px; color: #3C5074; flex: none; }
.band { background: var(--gc-band); padding: 16px 0 16px 16px; display: flex; gap: 12px; overflow: hidden; }
.banner { flex: none; width: 300px; height: 150px; border-radius: 12px; overflow: hidden; position: relative; padding: 16px; color: #fff;
          background: linear-gradient(120deg, #0138B3, #2458E0 55%, #57A0F8); }
.banner .t { font-size: 19px; font-weight: 800; line-height: 1.2; max-width: 180px; margin-top: 6px; }
.banner .p { font-size: 13px; margin-top: 6px; opacity: .92; }
.banner .p b { font-size: 22px; color: var(--gc-promo); }
.banner img.art { position: absolute; right: 8px; bottom: 10px; width: 92px; }
.banner img.by { height: 16px; }
.banner.ghost { background: linear-gradient(120deg, #DCE4F2, #EEF2F9); }
.tabs { display: flex; background: #fff; border-bottom: 1px solid var(--gc-divider); }
.tabs > div { flex: 1; text-align: center; padding: 14px 0 11px; font-size: 16px; font-weight: 600; color: var(--gc-text-4); border-bottom: 3px solid transparent; transition: .15s; }
.tabs > .on { color: var(--gc-tab-active); border-color: var(--gc-tab-active); }
.cats { display: grid; grid-template-columns: repeat(4, 1fr); row-gap: 22px; padding: 4px 4px 24px; }
.cats .tile { color: #2040A8; font-size: 14px; }
.cats .tile img { width: 50px; height: 50px; }

/* Health list */
.hero { flex: none; height: 116px; position: relative; overflow: hidden; background: linear-gradient(120deg, #BFE0F7, #8CC3EE); }
.hero b { position: absolute; left: 20px; bottom: 16px; font-size: 30px; font-weight: 800; color: var(--gc-heading); }
.hero img { position: absolute; width: 84px; }
.prod { display: flex; gap: 16px; align-items: center; padding: 18px 16px; background: #fff; border-bottom: 1px solid var(--gc-divider); }
.prod .logo { width: 52px; height: 52px; border-radius: 6px; flex: none; display: grid; place-items: center; font-weight: 800; color: #fff; font-size: 15px; }
.prod .logo img { width: 100%; height: 100%; }
.prod .pv { font-size: 14px; color: var(--gc-link); font-weight: 500; display: flex; align-items: center; gap: 8px; }
.prod .nm { font-size: 17px; font-weight: 600; color: var(--gc-text); margin: 3px 0 5px; }
.prod .mt { font-size: 13px; color: var(--gc-text-3); line-height: 1.6; }
.prod .mt b { color: var(--gc-text-2); font-weight: 500; }
.prod .chev { width: 22px; height: 22px; color: var(--gc-link); flex: none; margin-left: auto; }
.prod.feature { background: linear-gradient(90deg, #F3F7FF, #fff); box-shadow: inset 4px 0 0 var(--gc-cta); }
.prod.dim { opacity: .55; }

/* Product detail */
.pd-hero { height: 190px; margin: 0 16px; border-radius: 0 0 4px 4px; position: relative; overflow: hidden; color: #fff; padding: 18px;
           background: radial-gradient(circle at 85% 20%, #5AA6F8 0, transparent 45%), linear-gradient(125deg, #0138B3, #2458E0); }
.pd-hero .by { height: 20px; }
.pd-hero h2 { margin: 14px 0 6px; font-size: 24px; font-weight: 800; line-height: 1.15; max-width: 220px; }
.pd-hero p { margin: 0; font-size: 13.5px; opacity: .92; max-width: 210px; }
.pd-hero img.art { position: absolute; right: 12px; bottom: 14px; width: 110px; }
.ribbon { margin: 0 16px; background: var(--gc-promo); text-align: center; padding: 9px 10px; font-size: 13.5px; color: var(--gc-text); }
.ribbon b { display: block; font-weight: 800; font-size: 14px; }
.pd-tabs { margin: 0 16px; }
.pd-tabs > div { font-size: 14px; white-space: nowrap; }
.pd-body { margin: 0 16px; background: var(--gc-page); padding: 16px 0 8px; }
.kb { padding: 22px 20px 6px; text-align: center; }
.kb h3 { margin: 10px 0 8px; font-size: 19px; font-weight: 700; color: var(--gc-text); }
.kb > img { width: 46px; }
.kbi { display: flex; gap: 16px; text-align: left; padding: 12px 0 14px; }
.kbi img { width: 50px; height: 50px; flex: none; }
.kbi b { display: block; font-size: 16px; font-weight: 700; color: var(--gc-text); }
.kbi span { display: block; margin-top: 4px; font-size: 14px; color: var(--gc-text-3); line-height: 1.45; }
.cov-row { display: flex; align-items: center; gap: 14px; padding: 13px 16px; }
.cov-row + .cov-row { border-top: 1px solid var(--gc-divider); }
.cov-row img { width: 40px; height: 40px; flex: none; }
.cov-row .n { font-size: 15px; font-weight: 700; }
.cov-row .d { font-size: 12.5px; color: var(--gc-text-3); margin-top: 2px; }
.cov-row .a { margin-left: auto; font-size: 16px; font-weight: 800; white-space: nowrap; }
.cov-total { display: flex; justify-content: space-between; padding: 14px 16px; background: var(--gc-chip); border-radius: 0 0 var(--r-card) var(--r-card); font-weight: 700; }
.cov-total b { color: var(--gc-link); font-size: 18px; }
.list-x { padding: 6px 18px; }
.list-x div { display: flex; gap: 10px; padding: 10px 0; font-size: 14px; color: var(--gc-text-2); }
.list-x div + div { border-top: 1px solid var(--gc-divider); }
.list-x svg { width: 18px; height: 18px; flex: none; margin-top: 1px; }
.steps { padding: 6px 18px 12px; }
.step { display: flex; gap: 14px; padding: 12px 0; }
.step i { width: 28px; height: 28px; border-radius: 50%; background: var(--gc-chip); color: var(--gc-link); font-style: normal; font-weight: 800; display: grid; place-items: center; flex: none; font-size: 14px; }
.step b { display: block; font-size: 15px; }
.step span { font-size: 13.5px; color: var(--gc-text-3); }

/* Plan */
.h1 { font-size: 24px; font-weight: 800; letter-spacing: -.4px; margin: 6px 0 4px; }
.seg2 { margin-top: 16px; background: #DCE4F2; border-radius: 14px; padding: 4px; display: grid; grid-template-columns: 1fr 1fr; }
.seg2 button { height: 58px; border-radius: 11px; font-size: 15px; font-weight: 600; color: var(--gc-text-2); line-height: 1.25; }
.seg2 button small { display: block; font-size: 12px; font-weight: 500; color: var(--gc-text-3); }
.seg2 .on { background: #fff; color: var(--gc-cta); box-shadow: 0 1px 4px rgba(16,36,84,.12); }
.seg2 .on small { color: var(--gc-link); }
.due { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 12px; }
.due .k { font-size: 14px; }
.due .v { font-size: 26px; font-weight: 800; letter-spacing: -.5px; }
.due .v small { font-size: 14px; font-weight: 600; color: var(--gc-text-3); }

/* Checkout */
.sumcard { padding: 16px; display: flex; gap: 14px; align-items: center; }
.sumcard img { width: 48px; height: 48px; }
.feat { display: flex; align-items: center; gap: 10px; font-size: 14px; color: var(--gc-text-2); padding: 7px 0; }
.feat svg { width: 20px; height: 20px; color: var(--gc-success); flex: none; }
.decl { display: flex; gap: 12px; padding: 16px; font-size: 13.5px; line-height: 1.5; color: var(--gc-text-2); }
.pm { display: flex; align-items: center; gap: 12px; padding: 14px 16px; }
.pm + .pm { border-top: 1px solid var(--gc-divider); }
.pm .ico { width: 40px; height: 40px; flex: none; }
.pm .t { font-size: 15px; font-weight: 700; }
.pm .s { font-size: 12.5px; color: var(--gc-text-3); margin-top: 2px; }
.pm .radio { margin-left: auto; }
.pm.off { opacity: .5; }

/* MPIN sheet */
.sheet-bg { position: absolute; inset: 0; background: rgba(8,18,48,.45); z-index: 30; animation: fadeIn .2s; }
.sheet { position: absolute; left: 0; right: 0; bottom: 0; z-index: 31; background: #fff; border-radius: 22px 22px 0 0; padding: 18px 20px calc(10px + var(--sab));
         animation: up .3s cubic-bezier(.2,.8,.2,1); text-align: center; }
@keyframes up { from { transform: translateY(100%); } }
.sheet h3 { margin: 6px 0 4px; font-size: 19px; }
.sheet .meta { margin-bottom: 18px; }
.dots { display: flex; justify-content: center; gap: 18px; margin-bottom: 22px; }
.dots i { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--gc-cta); transition: .1s; }
.dots i.f { background: var(--gc-cta); }
.pad-k { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.pad-k button { height: 56px; font-size: 26px; font-weight: 600; border-radius: 12px; color: var(--gc-text); }
.pad-k button:active { background: var(--gc-page); }
.pad-k button svg { width: 26px; height: 26px; }

/* Processing / success */
.center { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 24px; }
.spin { width: 64px; height: 64px; border-radius: 50%; border: 6px solid var(--gc-chip); border-top-color: var(--gc-cta); animation: rot .8s linear infinite; }
@keyframes rot { to { transform: rotate(360deg); } }
.center h2 { margin: 22px 0 6px; font-size: 21px; }
.pop { animation: pop .45s cubic-bezier(.2,1.6,.4,1) both; }
@keyframes pop { from { transform: scale(.4); opacity: 0; } }
.succ-top { text-align: center; padding: 26px 16px 8px; }
.succ-top img { width: 84px; }
.succ-top h1 { margin: 12px 0 4px; font-size: 24px; font-weight: 800; }

/* Member card */
.hmo { border-radius: 18px; overflow: hidden; color: #fff; position: relative; padding: 18px 18px 16px;
       background: radial-gradient(circle at 100% 0, rgba(90,166,248,.6), transparent 50%), linear-gradient(130deg, #0138B3 0%, #1D48C4 50%, #3670F0 100%);
       box-shadow: 0 10px 24px rgba(1,56,179,.3); }
.hmo .top { display: flex; justify-content: space-between; align-items: center; }
.hmo .top img { height: 22px; }
.hmo .act { display: flex; gap: 6px; align-items: center; padding: 4px 10px; border-radius: 999px; background: rgba(255,255,255,.18); font-size: 11.5px; font-weight: 700; }
.hmo .act i { width: 7px; height: 7px; border-radius: 50%; background: #5EE08A; }
.hmo .nm { margin-top: 26px; font-size: 21px; font-weight: 700; }
.hmo .id { font-size: 13px; opacity: .85; letter-spacing: .5px; margin-top: 2px; }
.hmo .bt { margin-top: 14px; display: flex; justify-content: space-between; align-items: flex-end; font-size: 11px; opacity: .9; }
.hmo .bt b { display: block; font-size: 14px; opacity: 1; }
.hmo .pi { height: 16px; }
.hmo .chip { position: absolute; right: 18px; top: 56px; width: 64px; opacity: .9; }
.qrcard { margin-top: 14px; padding: 18px; text-align: center; }
.qrbox { display: inline-block; padding: 12px; border-radius: 14px; border: 1px solid var(--gc-divider); background: #fff; }
.qrbox svg { width: 150px; height: 150px; display: block; }
.util { padding: 4px 16px 8px; }
.util .u { padding: 11px 0; }
.util .u + .u { border-top: 1px solid var(--gc-divider); }
.util .row { font-size: 14px; }
.track { height: 7px; border-radius: 99px; background: #E3E9F2; margin-top: 8px; overflow: hidden; }
.track i { display: block; height: 100%; border-radius: 99px; background: var(--gc-link); }

/* Scene interstitials (presenter story beats) */
.scene { background: radial-gradient(circle at 50% 35%, #1D48C4, #061235 75%); color: #fff; }
.scene .center h2 { font-size: 30px; font-weight: 800; margin: 18px 0 10px; line-height: 1.2; }
.scene .center p { font-size: 16px; opacity: .85; max-width: 300px; line-height: 1.5; margin: 0; }
.scene .when { font-size: 13px; font-weight: 800; letter-spacing: 2px; text-transform: uppercase; color: var(--gc-promo); }
.scene .tap { margin-bottom: calc(30px + var(--sab)); font-size: 13px; opacity: .6; text-align: center; animation: blink 1.6s infinite; }
@keyframes blink { 50% { opacity: .25; } }
.scene img.big { width: 96px; }

/* Scanner */
.cam { background: #0D1220; color: #fff; }
.cam .view { flex: 1; position: relative; display: grid; place-items: center; overflow: hidden;
             background: radial-gradient(circle at 50% 45%, #2A3550 0, #0D1220 70%); }
.cam .poster { width: 210px; padding: 18px; border-radius: 16px; background: #fff; color: var(--gc-text); text-align: center; transform: rotate(-3deg); box-shadow: 0 20px 40px rgba(0,0,0,.4); opacity: .9; filter: blur(.3px); }
.cam .poster b { display: block; font-size: 13px; margin-top: 8px; }
.cam .poster small { font-size: 11px; color: var(--gc-text-3); }
.cam .poster svg { width: 150px; height: 150px; }
.cam .frame { position: absolute; width: 250px; height: 250px; left: 50%; top: 50%; margin: -150px 0 0 -125px; }
.cam .frame svg { width: 100%; height: 100%; }
.cam .laser { position: absolute; left: 10px; right: 10px; height: 3px; background: #4E93F7; box-shadow: 0 0 14px #4E93F7; animation: scan 1.6s ease-in-out infinite alternate; }
@keyframes scan { from { top: 12px; } to { top: 236px; } }
.cam .hint { padding: 22px 24px calc(30px + var(--sab)); text-align: center; font-size: 15px; background: #0D1220; }
.cam .hint b { display: block; font-size: 18px; margin-bottom: 4px; }
.cam .found { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(13,18,32,.55); animation: fadeIn .2s; }
.cam .found div { background: #fff; color: var(--gc-text); border-radius: 16px; padding: 18px 22px; font-weight: 700; display: flex; gap: 12px; align-items: center; }
.cam .found img { width: 34px; }

/* LOA */
.chk { padding: 8px 18px; }
.chk .s { display: flex; gap: 14px; align-items: center; padding: 12px 0; opacity: .35; transition: opacity .25s; }
.chk .s.on { opacity: 1; }
.chk .s i { width: 30px; height: 30px; border-radius: 50%; background: var(--gc-chip); display: grid; place-items: center; flex: none; color: var(--gc-link); }
.chk .s.done i { background: var(--gc-success); color: #fff; }
.chk .s i svg { width: 17px; height: 17px; }
.chk .s b { display: block; font-size: 15px; }
.chk .s span { font-size: 12.5px; color: var(--gc-text-3); }
.timer { text-align: center; font-size: 13px; color: var(--gc-text-3); margin-top: 6px; }
.timer b { font-size: 34px; font-weight: 800; color: var(--gc-cta); letter-spacing: -1px; display: block; font-variant-numeric: tabular-nums; }
.loa { overflow: hidden; }
.loa .hd { padding: 16px; background: var(--gc-success-soft); display: flex; gap: 12px; align-items: center; }
.loa .hd img { width: 42px; }
.loa .hd b { display: block; font-size: 16px; color: var(--gc-success); }
.loa .hd span { font-size: 12.5px; color: var(--gc-text-2); }
.loa .rows { padding: 4px 16px 8px; }

/* Bill */
.dc { display: flex; gap: 14px; align-items: center; padding: 16px; }
.dc img { width: 46px; }
.dc b { display: block; font-size: 17px; }
.bal-due { margin-top: 14px; padding: 18px; text-align: center; }
.bal-due .v { font-size: 38px; font-weight: 800; color: var(--gc-cta); letter-spacing: -1px; margin-top: 4px; }
.limit { margin-top: 14px; display: flex; gap: 12px; align-items: center; padding: 14px; border-radius: 14px; background: #FFF8E1; border: 1px solid #F7D774; }
.limit img { width: 40px; }
.limit .t { font-size: 13px; color: #6B5310; }
.limit .t b { display: block; font-size: 15px; color: var(--gc-text); }

/* Gap loan */
.amt-top { text-align: center; padding: 18px 16px 16px; background: #fff; }
.amt-top .v { font-size: 34px; font-weight: 800; letter-spacing: -1px; margin: 4px 0 8px; }
.loan-opt { padding: 16px; border: 1.5px solid var(--gc-cta); }
.terms { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 14px; }
.terms button { padding: 10px 0; border-radius: 12px; border: 1.5px solid var(--gc-divider); text-align: center; background: #fff; }
.terms button b { display: block; font-size: 16px; }
.terms button span { font-size: 12.5px; color: var(--gc-text-3); }
.terms .on { border-color: var(--gc-cta); background: var(--gc-chip); }
.terms .on b { color: var(--gc-cta); }
.loan-sum { margin-top: 14px; padding: 4px 14px; border: 1.5px dashed #C8D3E8; border-radius: 12px; }
.consent { display: flex; gap: 12px; padding: 14px 2px 4px; font-size: 13px; line-height: 1.5; color: var(--gc-text-2); }
.consent a { color: var(--gc-link); font-weight: 700; }

/* Exit pass */
.pass { overflow: hidden; border-top: 5px solid var(--gc-cta); }
.pass .tp { text-align: center; padding: 16px; }
.pass .tp b { font-size: 17px; }
.pass .tp svg { width: 120px; height: 120px; margin-top: 10px; }
.pass .bt { border-top: 1.5px dashed #D2DAE8; padding: 6px 16px 12px; }
.next { margin-top: 12px; display: flex; gap: 12px; align-items: center; padding: 14px 16px; }
.next img { width: 40px; }

/* Recap */
.recap .stat { display: flex; gap: 16px; align-items: center; padding: 16px 0; text-align: left; border-bottom: 1px solid rgba(255,255,255,.15); width: 100%; }
.recap .stat b { font-size: 26px; font-weight: 800; color: var(--gc-promo); width: 118px; flex: none; white-space: nowrap; }
.recap .stat span { font-size: 15px; opacity: .9; }

/* Presenter menu */
.pm-menu { position: absolute; inset: 0; z-index: 60; background: rgba(6,18,53,.92); color: #fff; padding: calc(var(--sat) + 10px) 18px 20px; overflow-y: auto; animation: fadeIn .15s; }
.pm-menu h3 { margin: 6px 0 4px; }
.pm-menu p { margin: 0 0 12px; font-size: 12.5px; opacity: .7; }
.pm-menu button { display: block; width: 100%; text-align: left; padding: 12px 14px; margin-bottom: 6px; border-radius: 10px; background: rgba(255,255,255,.08); color: #fff; font-size: 15px; }
.pm-menu button.cur { background: var(--gc-cta); }
.pm-menu button.x { background: transparent; border: 1px solid rgba(255,255,255,.3); text-align: center; margin-top: 10px; }
.toast { position: absolute; left: 50%; top: calc(var(--sat) + 64px); transform: translateX(-50%); z-index: 45; background: rgba(16,36,84,.92); color: #fff; padding: 10px 16px; border-radius: 999px; font-size: 13px; animation: fadeIn .2s; white-space: nowrap; }

/* PNG export (?shot): device frame on a transparent page */
html.shot, html.shot body, .framed.shot { background: transparent; }
.framed.shot .device { box-shadow: 0 0 0 11px #1A1C22, 0 0 0 13px #3A3D46; }

</style>
</head>

const repay = m => gap * (1 + P.addOn * m);

function qrSvg(seed, n = 29) {
  let s = seed;
  const rnd = () => (s = (s * 1103515245 + 12345) % 2147483648) / 2147483648;
  const g = Array.from({ length: n }, () => Array(n).fill(0));
  const reserved = (r, c) => (r < 8 && c < 8) || (r < 8 && c >= n - 8) || (r >= n - 8 && c < 8);
  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) {
    if (reserved(r, c)) continue;
    if (r === 6) g[r][c] = c % 2 === 0 ? 1 : 0;
    else if (c === 6) g[r][c] = r % 2 === 0 ? 1 : 0;
    else g[r][c] = rnd() > 0.52 ? 1 : 0;
  }
  const finder = (r0, c0) => {
    for (let r = 0; r < 7; r++) for (let c = 0; c < 7; c++) {
      const edge = r === 0 || r === 6 || c === 0 || c === 6;
      const core = r >= 2 && r <= 4 && c >= 2 && c <= 4;
      g[r0 + r][c0 + c] = edge || core ? 1 : 0;
    }
  };
  finder(0, 0); finder(0, n - 7); finder(n - 7, 0);
  for (let r = 0; r < 5; r++) for (let c = 0; c < 5; c++) {
    const edge = r === 0 || r === 4 || c === 0 || c === 4;
    g[n - 9 + r][n - 9 + c] = edge || (r === 2 && c === 2) ? 1 : 0;
  }
  let rects = '';
  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++)
    if (g[r][c]) rects += `<rect x="${c}" y="${r}" width="1.02" height="1.02"/>`;
  return `<svg viewBox="-1 -1 ${n + 2} ${n + 2}" shape-rendering="crispEdges"><rect x="-1" y="-1" width="${n + 2}" height="${n + 2}" fill="#fff"/><g fill="#102454">${rects}</g></svg>`;
}

// ---------------------------------------------------------------- router
const device = document.getElementById('device');
let stack = [];
let cur = null;

function build(id) {
  const def = SCREENS[id].render();
  const el = document.createElement('div');
  el.className = 'scr ' + (def.cls || '');
  el.innerHTML = def.html;
  el.dataset.id = id;
  return { el, mount: def.mount };
}

function show(id, mode) {
  const { el, mount } = build(id);
  const old = cur;
  if (old && old._cleanup) old._cleanup();
  device.appendChild(el);
  if (old) {
    if (mode === 'fwd') { el.classList.add('enter-fwd'); old.classList.add('leave-fwd'); }
    else if (mode === 'back') { el.classList.add('enter-back'); old.classList.add('leave-back'); }
    else if (mode === 'fade') { el.classList.add('fade'); }
    setTimeout(() => old.remove(), mode === 'none' ? 0 : 340);
  }
  cur = el;
  if (mount) mount(el);
}

function go(id, mode = 'fwd') {
  if (SCREENS[id].skip || SCREENS[id].scene) { /* transient screens are not pushed */ }
  else stack.push(id);
  show(id, mode);
}

function back() {
  if (stack.length < 2) return;
  stack.pop();
  show(stack[stack.length - 1], 'back');
}

function refresh() {
  const top = cur.querySelector('.body');
  const y = top ? top.scrollTop : 0;
  const { el, mount } = build(cur.dataset.id);
  if (cur._cleanup) cur._cleanup();
  device.replaceChild(el, cur);
  cur = el;
  const b = el.querySelector('.body'); if (b) b.scrollTop = y;
  if (mount) mount(el);
}

function restart() {
  Object.assign(S, { plan: 'monthly', declared: false, term: 12, consent: false, covered: false, showBal: false, prodTab: 0 });
  stack = ['login'];
  show('login', 'fade');
}

function toast(msg) {
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg;
  device.appendChild(t); setTimeout(() => t.remove(), 1800);
}

// MPIN bottom sheet: four taps on the keypad, then onDone.
function mpin(title, sub, onDone) {
  const host = cur;
  host.insertAdjacentHTML('beforeend', `<div class="sheet-bg"></div><div class="sheet">
    <div class="meta" style="margin:0">${sub}</div><h3>${title}</h3><div class="meta">Enter your 4-digit MPIN</div>
    <div class="dots"><i></i><i></i><i></i><i></i></div>
    <div class="pad-k">${[1, 2, 3, 4, 5, 6, 7, 8, 9].map(n => `<button data-k>${n}</button>`).join('')}<button></button><button data-k>0</button><button data-del>${L('arrow-left')}</button></div></div>`);
  let n = 0;
  const dots = host.querySelectorAll('.dots i');
  host.querySelector('.sheet').addEventListener('click', e => {
    if (e.target.closest('[data-k]') && n < 4) {
      dots[n++].classList.add('f');
      if (n === 4) setTimeout(onDone, 250);
    } else if (e.target.closest('[data-del]') && n > 0) dots[--n].classList.remove('f');
    e.stopPropagation();
  });
  host.querySelector('.sheet-bg').addEventListener('click', e => {
    e.stopPropagation(); host.querySelector('.sheet').remove(); host.querySelector('.sheet-bg').remove();
  });
}

const ACTIONS = {
  faceid() {
    device.insertAdjacentHTML('beforeend', `<div class="faceid"><div>${faceGlyph}</div></div>`);
    const f = device.lastElementChild;
    setTimeout(() => { f.querySelector('div').innerHTML = `<span class="ok">${L('check-circle')}</span>`; f.querySelector('svg').style.cssText = 'width:76px;height:76px'; }, 700);
    setTimeout(() => { f.remove(); go('home', 'fade'); }, 1150);
  },
  toggleBal() { S.showBal = !S.showBal; refresh(); },
  prodTab(el) { S.prodTab = +el.dataset.i; refresh(); },
  plan(el) { S.plan = el.dataset.v; refresh(); },
  declare() { S.declared = !S.declared; refresh(); },
  payPlan() { mpin(peso(S.plan === 'monthly' ? P.monthly : P.annual), 'GCash Health Access', () => go('activating', 'fade')); },
  term(el) { S.term = +el.dataset.m; refresh(); },
  consent() { S.consent = !S.consent; refresh(); },
  payLoan() { mpin(peso(gap), `Health Gap Loan · ${S.term} months`, () => go('paying', 'fade')); },
  restart,
};

device.addEventListener('click', e => {
  const a = e.target.closest('[data-act]');
  if (a) return ACTIONS[a.dataset.act](a);
  const g = e.target.closest('[data-go]');
  if (g) return go(g.dataset.go, SCREENS[g.dataset.go].scene ? 'fade' : 'fwd');
  if (e.target.closest('[data-back]')) return back();
});

// Triple-tap the top edge of the screen (or press M on a laptop) to jump to any screen.
function menu() {
  if ($('.pm-menu', device)) return;
  const ids = Object.keys(SCREENS).filter(id => !SCREENS[id].skip);
  device.insertAdjacentHTML('beforeend', `<div class="pm-menu"><h3>Presenter menu</h3><p>Jump to any screen. Triple-tap the top edge to open this again.</p><p style="font-size:11px;opacity:.55">${window.__fit || ''}</p>
    ${ids.map((id, i) => `<button data-jump="${id}" class="${cur && cur.dataset.id === id ? 'cur' : ''}">${i + 1}. ${SCREENS[id].title}</button>`).join('')}
    <button class="x" data-jump="__restart">Restart from login</button><button class="x" data-jump="__close">Close</button></div>`);
  const m = device.lastElementChild;
  m.addEventListener('click', e => {
    const b = e.target.closest('[data-jump]'); if (!b) return;
    e.stopPropagation(); m.remove();
    const id = b.dataset.jump;
    if (id === '__restart') return restart();
    if (id === '__close') return;
    if (['covered', 'card', 'scene-er', 'scan', 'loa', 'scene-discharge', 'bill', 'loan', 'done', 'recap'].includes(id)) S.covered = true;
    if (id === 'done' || id === 'recap') S.consent = true;
    stack = ['home', id].filter((v, i, a) => a.indexOf(v) === i);
    show(id, 'fade');
  });
}
let taps = [];
device.addEventListener('pointerdown', e => {
  const r = device.getBoundingClientRect();
  if (e.clientY - r.top > 60) return;
  const now = Date.now(); taps = taps.filter(t => now - t < 700); taps.push(now);
  if (taps.length >= 3) { taps = []; menu(); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'm' || e.key === 'M') menu();
  if (e.key === 'Escape') { const m = $('.pm-menu', device); if (m) m.remove(); }
  if (e.key === 'Backspace') back();
});

// ---------------------------------------------------------------- boot
const standalone = window.navigator.standalone || matchMedia('(display-mode: standalone)').matches;
const phone = matchMedia('(max-width: 500px)').matches;
if (!phone && !standalone) document.body.classList.add('framed');
// Size the app to the full screen. iOS home-screen apps report a layout viewport that is
// shorter than the screen by the status bar, which left an empty strip at the bottom.
const homeScreen = standalone || matchMedia('(display-mode: fullscreen)').matches || matchMedia('(display-mode: minimal-ui)').matches;
// Inside Google Apps Script the demo runs in a frame: size to the frame, and pad for the
// status bar and home indicator ourselves (env(safe-area-inset-*) reads 0 inside frames).
const embedded = (() => { try { return window.top !== window.self; } catch (e) { return true; } })();
const iOS = /iPhone|iPad|iPod/.test(navigator.userAgent);
function fitHeight() {
  const root = document.documentElement;
  const portraitScreenH = Math.max(screen.height, screen.width);
  if (embedded) {
    root.style.setProperty('--app-h', innerHeight + 'px');
    if (iOS) {
      const underStatusBar = innerHeight >= portraitScreenH - 4;   // frame starts at the very top
      const statusBar = portraitScreenH >= 874 ? 62 : portraitScreenH >= 852 ? 59 : 47;
      root.style.setProperty('--sat', underStatusBar ? statusBar + 'px' : '0px');
      root.style.setProperty('--sab', innerHeight >= portraitScreenH - 70 ? '34px' : '0px');
    }
    window.__fit = `framed · view ${innerHeight}×${innerWidth} · screen ${screen.height} · home-screen ${homeScreen}`;
    return;
  }
  // On the home screen, always fill the physical screen; in Safari use the visible viewport.
  const h = homeScreen ? Math.max(innerHeight, portraitScreenH) : innerHeight;
  root.style.setProperty('--app-h', h + 'px');
  root.classList.toggle('fullh', homeScreen);
  window.__fit = `view ${innerHeight}×${innerWidth} · screen ${screen.height}×${screen.width} · app ${h} · home-screen ${homeScreen}`;
}
fitHeight();
addEventListener('resize', fitHeight);
addEventListener('orientationchange', () => setTimeout(fitHeight, 300));
if (location.search.includes('shot')) document.documentElement.classList.add('shot'), document.body.classList.add('shot'); // transparent backdrop for PNG export
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
document.addEventListener('gesturestart', e => e.preventDefault());
// index.html#loan opens a screen directly (handy for rehearsing one part).
const start = location.hash.slice(1);
if (SCREENS[start]) {
  Object.assign(S, { covered: true, declared: start === 'checkout' ? false : true, consent: ['done', 'recap'].includes(start) });
  stack = ['home', start];
  show(start, 'none');
} else restart();

</script>
</body>
